name: Build and review checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK components
        run: python3 tools/bootstrap_android_sdk.py
      - name: Build unsigned inspection artifact
        run: ./build.sh --unsigned
      - name: Run host checks
        run: python3 tests/run-host-checks.py
      - name: Audit source and compiled package
        run: python3 tools/audit_release.py --apk build/OneUIHomeHandoff-1.2.0.unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-inspection-apk
          path: |
            build/OneUIHomeHandoff-*.unsigned.apk
            build/OneUIHomeHandoff-*.unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14
